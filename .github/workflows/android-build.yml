name: Android Build

# Builds a debug APK for the CBT Trainer app.
#
# The app uses native modules (WatermelonDB, expo-secure-store) so it cannot run in Expo Go.
# CI therefore runs `expo prebuild` to generate the native Android project (Continuous Native
# Generation — the ios/ and android/ folders are intentionally not committed), then assembles a
# DEBUG APK. Debug is chosen deliberately: it needs no signing keystore and does not run
# Metro/Babel (NativeWind/reanimated) at build time, keeping the native build self-contained.

on:
  push:
    branches:
      - claude/cbt-app-architecture-nb3tml
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Unit tests (guardrails + protocol machine)
        run: npm test -- --ci

  android-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo prebuild (generate native android project)
        run: npx expo prebuild --platform android --no-install

      - name: Gradle build (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbt-trainer-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
